        * {

        #toeIntro {
    position: absolute;

    <canvas id="gameCanvas"></canvas>
    <script>
        console.log('Hello');
    </script><script>
async function fetchAndDecompress(url) {
    const response = await fetch(url);

    if (!response.ok)
        throw new Error(`HTTP error! status: ${response.status}`);

    const decompressionStream =
        new DecompressionStream('deflate-raw');

    const decompressedStream =
        response.body.pipeThrough(decompressionStream);

    const decompressedResponse =
        new Response(decompressedStream);

    const buffer =
        await decompressedResponse.arrayBuffer();

    return new Uint8Array(buffer);
}

const messages = [
    "Loading...",
    "i love toes hehe",
    "toes detected",
    "warming up toe engine",
    "toe physics enabled",
    "certified toe moment",
    "flowrix toe edition"
];

const toeText = document.getElementById("toeText");

let msgIndex = 0;

const msgInterval = setInterval(() => {
    msgIndex = (msgIndex + 1) % messages.length;
    toeText.textContent = messages[msgIndex];
}, 700);

(async () => {

try {

    const bundle =
        await fetchAndDecompress('bundle.bin');

    await new Promise(r => setTimeout(r, 5000));

    const scriptData =
        new TextDecoder().decode(bundle);

    const script =
        document.createElement('script');

    script.textContent = scriptData;

    document.body.appendChild(script);

    clearInterval(msgInterval);

    const intro =
        document.getElementById("toeIntro");

    intro.style.transition =
        "opacity 0.8s ease";

    intro.style.opacity = "0";

    setTimeout(() => {
        intro.remove();
    }, 800);

} catch (err) {
    console.error(err);

    toeText.textContent =
        "toe explosion :(";
}

})();
</script></body>
