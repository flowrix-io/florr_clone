<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>florr.io clone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
            font-weight: 700;
            background-color: #000;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #loadingScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            text-align: center;
            font-size: 88px;
            transform: translate(-50%, -50%);
            color: #fff;
        }

    </style>
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
</head>
<body>
    <span id="loadingScreen">Loading...</span>
    <canvas id="gameCanvas"></canvas>
    <script>
        console.log('Hello');
    </script>
    <script>
        async function fetchAndDecompress(url) {
            // 1. Fetch the compressed binary file
            const response = await fetch(url);
            
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            // 2. Create a DecompressionStream with 'deflate-raw'
            const decompressionStream = new DecompressionStream('deflate-raw');

            // 3. Pipe the response body (a ReadableStream) through the decompressor
            const decompressedStream = response.body.pipeThrough(decompressionStream);

            // 4. Read the resulting data (e.g., as an ArrayBuffer or Blob)
            const decompressedResponse = new Response(decompressedStream);
            const buffer = await decompressedResponse.arrayBuffer();

            return new Uint8Array(buffer);
        }
        const loadingScreen = document.createElement('div');
        loadingScreen.innerHTML = '<div style="text-align: center;"><h1 style="color: yellow; font-size: 48px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">Decompressing bundle...</h1><p style="color: rgba(255,255,255,0.9); font-size: 20px; margin-bottom: 30px;">Please wait while we decompress the bundle...</p></div>';
        document.body.appendChild(loadingScreen);
        console.log('Decompressing bundle...');

        const fetchedBundle = fetchAndDecompress('bundle.bin');
        fetchedBundle.then(bundle => {
            const scriptData = new TextDecoder().decode(bundle);
            const script = document.createElement('script');
            script.textContent = scriptData;
            document.body.appendChild(script);

        });
    </script>
</body>
</html>
