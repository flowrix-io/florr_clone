<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Axolotl Map Editor</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .tools {
            width: 300px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }

        .canvas-container {
            position: relative;
            overflow: auto;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
        }

        canvas {
            background: #111;
        }

        .tool-section {
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #4CAF50;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button.selected {
            background: #45a049;
            box-shadow: 0 0 0 2px white;
        }

        .element-list {
            max-height: 300px;
            overflow-y: auto;
            background: #333;
            padding: 10px;
            border-radius: 4px;
        }

        .element-item {
            padding: 5px;
            margin: 2px 0;
            background: #444;
            border-radius: 3px;
            cursor: pointer;
        }

        .element-item:hover {
            background: #555;
        }

        input, select {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 3px;
        }

        .minimap {
            position: absolute;
            right: 20px;
            top: 20px;
            border: 2px solid #333;
            background: rgba(0, 0, 0, 0.5);
        }

        .coordinates {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tools">
            <div class="tool-section">
                <h2>Tools</h2>
                <button id="wallTool">Wall</button>
                <button id="spawnTool">Spawn</button>
                <button id="teleporterTool">Teleporter</button>
                <button id="safeZoneTool">Safe Zone</button>
                <button id="selectTool">Select</button>
                <button id="deleteTool">Delete</button>
            </div>

            <div class="tool-section">
                <h2>Properties</h2>
                <div id="properties">
                    <input type="number" id="elementWidth" placeholder="Width">
                    <input type="number" id="elementHeight" placeholder="Height">
                    <select id="spawnType" style="display: none;">
                        <option value="common">Common</option>
                        <option value="uncommon">Uncommon</option>
                        <option value="rare">Rare</option>
                        <option value="epic">Epic</option>
                        <option value="legendary">Legendary</option>
                        <option value="mythic">Mythic</option>
                    </select>
                    <div id="teleporterProps" style="display: none;">
                        <input type="number" id="teleportX" placeholder="Teleport to X">
                        <input type="number" id="teleportY" placeholder="Teleport to Y">
                        <select id="serverPortSelect">
                            <option value="">Same Server (Local Teleport)</option>
                            <option value="3000">Server 3000 (Server1)</option>
                            <option value="3001">Server 3001 (Server2)</option>
                            <option value="3002">Server 3002 (Server3)</option>
                            <option value="custom">Custom Port...</option>
                        </select>
                        <input type="number" id="customServerPort" placeholder="Custom Server Port" style="display: none;" min="1" max="65535">
                        <div id="serverPortInfo" style="font-size: 12px; color: #888; margin-top: 5px;">
                            Leave empty for same-server teleportation
                        </div>
                    </div>
                </div>
            </div>

            <div class="tool-section">
                <h2>Elements</h2>
                <div id="elementList" class="element-list"></div>
            </div>

            <div class="tool-section">
                <h2>Actions</h2>
                <button id="exportMap">Export Map</button>
                <button id="importMap">Import Map</button>
                <button id="validateMap">Validate Map</button>
                <button id="clearMap">Clear Map</button>
            </div>

            <div class="tool-section">
                <h2>Legend</h2>
                <div style="font-size: 12px; line-height: 1.4;">
                    <div style="margin: 5px 0;">
                        <span style="color: #4CAF50;">■</span> Same-server teleporter
                    </div>
                    <div style="margin: 5px 0;">
                        <span style="color: #2196F3;">■</span> Cross-server teleporter
                    </div>
                    <div style="margin: 5px 0;">
                        <span style="color: #FFD700;">♦</span> Cross-server indicator
                    </div>
                    <div style="margin: 10px 0; padding-top: 10px; border-top: 1px solid #444;">
                        Cross-server teleporters transfer players between different server ports while preserving all progress.
                    </div>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mapCanvas"></canvas>
            <canvas id="minimapCanvas" class="minimap"></canvas>
        </div>
    </div>

    <div class="coordinates" id="coordinates">X: 0, Y: 0</div>

    <script>
        // Constants from your game
        const WORLD_WIDTH = 20000;
        const WORLD_HEIGHT = 20000;
        const COLORS = {
            wall: '#666',
            spawn: '#4CAF50',
            teleporter: '#2196F3',
            safe_zone: '#FFC107'
        };

        // Editor state
        let currentTool = 'wall';
        let elements = [];
        let selectedElement = null;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragOffset = { x: 0, y: 0 };
        let cameraOffset = { x: 0, y: 0 };
        let scale = 0.1;

        // Setup canvases
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const minimap = document.getElementById('minimapCanvas');
        const minimapCtx = minimap.getContext('2d');

        // Server port handling
        document.getElementById('serverPortSelect').addEventListener('change', function() {
            const customPortInput = document.getElementById('customServerPort');
            const serverPortInfo = document.getElementById('serverPortInfo');
            
            if (this.value === 'custom') {
                customPortInput.style.display = 'block';
                serverPortInfo.textContent = 'Enter custom server port (1-65535)';
            } else {
                customPortInput.style.display = 'none';
                if (this.value === '') {
                    serverPortInfo.textContent = 'Same-server teleportation (no network transfer)';
                } else {
                    serverPortInfo.textContent = `Cross-server teleportation to port ${this.value}`;
                }
            }
        });

        // Set canvas sizes
        canvas.width = WORLD_WIDTH * scale;
        canvas.height = WORLD_HEIGHT * scale;
        minimap.width = 200;
        minimap.height = 200;

        // Tool selection
        document.querySelectorAll('.tools button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tools button').forEach(b => b.classList.remove('selected'));
                button.classList.add('selected');
                currentTool = button.id.replace('Tool', '');
                updatePropertiesPanel();
            });
        });

        // Mouse events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', updateCoordinates);

        function updateCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.round((e.clientX - rect.left + cameraOffset.x) / scale);
            const y = Math.round((e.clientY - rect.top + cameraOffset.y) / scale);
            document.getElementById('coordinates').textContent = `X: ${x}, Y: ${y}`;
        }

        function startDrawing(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left + cameraOffset.x) / scale;
            const y = (e.clientY - rect.top + cameraOffset.y) / scale;

            if (currentTool === 'select') {
                handleSelection(x, y);
            } else if (currentTool === 'delete') {
                handleDeletion(x, y);
            } else {
                createNewElement(x, y);
            }

            isDragging = true;
            dragStart = { x, y };
            render();
        }

        function draw(e) {
            if (!isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left + cameraOffset.x) / scale;
            const y = (e.clientY - rect.top + cameraOffset.y) / scale;

            if (selectedElement) {
                if (currentTool === 'select') {
                    selectedElement.x = x - dragOffset.x;
                    selectedElement.y = y - dragOffset.y;
                }
            } else if (currentTool !== 'select' && currentTool !== 'delete') {
                const width = x - dragStart.x;
                const height = y - dragStart.y;
                elements[elements.length - 1].width = Math.abs(width);
                elements[elements.length - 1].height = Math.abs(height);
                elements[elements.length - 1].x = width > 0 ? dragStart.x : x;
                elements[elements.length - 1].y = height > 0 ? dragStart.y : y;
            }

            render();
        }

        function stopDrawing() {
            isDragging = false;
            updateElementList();
        }

        function createNewElement(x, y) {
            const element = {
                type: currentTool,
                x: x,
                y: y,
                width: 0,
                height: 0,
                properties: {}
            };

            if (currentTool === 'spawn') {
                element.properties.spawnType = document.getElementById('spawnType').value;
            } else if (currentTool === 'teleporter') {
                const teleportTo = {
                    x: parseInt(document.getElementById('teleportX').value) || 0,
                    y: parseInt(document.getElementById('teleportY').value) || 0
                };

                // Handle server port configuration
                const serverPortSelect = document.getElementById('serverPortSelect');
                const customServerPort = document.getElementById('customServerPort');
                
                let serverPort = null;
                if (serverPortSelect.value === 'custom') {
                    const customPort = parseInt(customServerPort.value);
                    if (customPort && customPort >= 1 && customPort <= 65535) {
                        serverPort = customPort;
                    }
                } else if (serverPortSelect.value !== '') {
                    serverPort = parseInt(serverPortSelect.value);
                }

                // Only add serverPort if it's different from current server
                if (serverPort) {
                    teleportTo.serverPort = serverPort;
                }

                element.properties.teleportTo = teleportTo;
            } else if (currentTool === 'safe_zone') {
                element.properties.isNoCombat = true;
                element.properties.isSafeZone = true;
            }

            elements.push(element);
        }

        function handleSelection(x, y) {
            selectedElement = elements.find(element => 
                x >= element.x && x <= element.x + element.width &&
                y >= element.y && y <= element.y + element.height
            );

            if (selectedElement) {
                dragOffset.x = x - selectedElement.x;
                dragOffset.y = y - selectedElement.y;
            }
        }

        function handleDeletion(x, y) {
            const index = elements.findIndex(element => 
                x >= element.x && x <= element.x + element.width &&
                y >= element.y && y <= element.y + element.height
            );

            if (index !== -1) {
                elements.splice(index, 1);
                updateElementList();
            }
        }

        function render() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            minimapCtx.clearRect(0, 0, minimap.width, minimap.height);

            // Draw grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            const gridSize = 1000 * scale;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw elements
            elements.forEach(element => {
                ctx.fillStyle = COLORS[element.type];
                ctx.fillRect(
                    element.x * scale - cameraOffset.x,
                    element.y * scale - cameraOffset.y,
                    element.width * scale,
                    element.height * scale
                );

                // Add special visual indicator for cross-server teleporters
                if (element.type === 'teleporter' && element.properties.teleportTo?.serverPort) {
                    // Draw cross-server indicator (small diamond in corner)
                    const x = element.x * scale - cameraOffset.x;
                    const y = element.y * scale - cameraOffset.y;
                    const size = Math.min(element.width * scale, element.height * scale) * 0.3;
                    
                    ctx.fillStyle = '#FFD700'; // Gold color
                    ctx.save();
                    ctx.translate(x + size / 2, y + size / 2);
                    ctx.rotate(Math.PI / 4); // 45 degrees
                    ctx.fillRect(-size / 4, -size / 4, size / 2, size / 2);
                    ctx.restore();
                    
                    // Add port number text
                    ctx.fillStyle = '#fff';
                    ctx.font = `${Math.max(10, element.width * scale * 0.1)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText(
                        element.properties.teleportTo.serverPort.toString(),
                        x + element.width * scale / 2,
                        y + element.height * scale / 2 + 15
                    );
                }

                // Draw on minimap
                minimapCtx.fillStyle = COLORS[element.type];
                minimapCtx.fillRect(
                    (element.x / WORLD_WIDTH) * minimap.width,
                    (element.y / WORLD_HEIGHT) * minimap.height,
                    (element.width / WORLD_WIDTH) * minimap.width,
                    (element.height / WORLD_HEIGHT) * minimap.height
                );
                
                // Add indicator on minimap for cross-server teleporters
                if (element.type === 'teleporter' && element.properties.teleportTo?.serverPort) {
                    minimapCtx.fillStyle = '#FFD700';
                    minimapCtx.fillRect(
                        (element.x / WORLD_WIDTH) * minimap.width,
                        (element.y / WORLD_HEIGHT) * minimap.height,
                        Math.max(2, (element.width / WORLD_WIDTH) * minimap.width),
                        Math.max(2, (element.height / WORLD_HEIGHT) * minimap.height)
                    );
                }
            });

            // Draw selection
            if (selectedElement) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    selectedElement.x * scale - cameraOffset.x,
                    selectedElement.y * scale - cameraOffset.y,
                    selectedElement.width * scale,
                    selectedElement.height * scale
                );
            }
        }

        function updatePropertiesPanel() {
            const spawnType = document.getElementById('spawnType');
            const teleporterProps = document.getElementById('teleporterProps');

            spawnType.style.display = currentTool === 'spawn' ? 'block' : 'none';
            teleporterProps.style.display = currentTool === 'teleporter' ? 'block' : 'none';
        }

        function updateElementList() {
            const list = document.getElementById('elementList');
            list.innerHTML = '';
            elements.forEach((element, index) => {
                const item = document.createElement('div');
                item.className = 'element-item';
                
                let displayText = `${element.type} (${Math.round(element.x)}, ${Math.round(element.y)})`;
                
                // Add extra info for specific element types
                if (element.type === 'spawn' && element.properties.spawnType) {
                    displayText += ` - ${element.properties.spawnType}`;
                } else if (element.type === 'teleporter' && element.properties.teleportTo) {
                    const teleportTo = element.properties.teleportTo;
                    displayText += ` -> (${teleportTo.x}, ${teleportTo.y})`;
                    if (teleportTo.serverPort) {
                        displayText += ` [Port: ${teleportTo.serverPort}]`;
                        item.style.borderLeft = '3px solid #2196F3'; // Blue border for cross-server
                        item.title = `Cross-server teleporter to port ${teleportTo.serverPort}`;
                    } else {
                        item.style.borderLeft = '3px solid #4CAF50'; // Green border for same-server
                        item.title = 'Same-server teleporter';
                    }
                }
                
                item.textContent = displayText;
                item.onclick = () => {
                    selectedElement = element;
                    updatePropertiesFromElement(element);
                    render();
                };
                list.appendChild(item);
            });
        }

        // New function to update properties panel when selecting an element
        function updatePropertiesFromElement(element) {
            if (element.type === 'teleporter' && element.properties.teleportTo) {
                const teleportTo = element.properties.teleportTo;
                document.getElementById('teleportX').value = teleportTo.x || 0;
                document.getElementById('teleportY').value = teleportTo.y || 0;
                
                const serverPortSelect = document.getElementById('serverPortSelect');
                const customServerPort = document.getElementById('customServerPort');
                
                if (teleportTo.serverPort) {
                    // Check if it's one of the predefined ports
                    const predefinedPorts = ['3000', '3001', '3002'];
                    if (predefinedPorts.includes(teleportTo.serverPort.toString())) {
                        serverPortSelect.value = teleportTo.serverPort.toString();
                        customServerPort.style.display = 'none';
                    } else {
                        // It's a custom port
                        serverPortSelect.value = 'custom';
                        customServerPort.value = teleportTo.serverPort;
                        customServerPort.style.display = 'block';
                    }
                    document.getElementById('serverPortInfo').textContent = 
                        `Cross-server teleportation to port ${teleportTo.serverPort}`;
                } else {
                    serverPortSelect.value = '';
                    customServerPort.style.display = 'none';
                    document.getElementById('serverPortInfo').textContent = 
                        'Same-server teleportation (no network transfer)';
                }
            } else if (element.type === 'spawn' && element.properties.spawnType) {
                document.getElementById('spawnType').value = element.properties.spawnType;
            }
        }

        // Export/Import functionality
        document.getElementById('exportMap').onclick = () => {
            const mapData = JSON.stringify(elements, null, 2);
            const blob = new Blob([mapData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'map.json';
            a.click();
        };

        document.getElementById('importMap').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    elements = JSON.parse(event.target.result);
                    updateElementList();
                    render();
                };
                reader.readAsText(file);
            };
            input.click();
        };

        document.getElementById('clearMap').onclick = () => {
            if (confirm('Are you sure you want to clear the map?')) {
                elements = [];
                selectedElement = null;
                updateElementList();
                render();
            }
        };

        document.getElementById('validateMap').onclick = () => {
            const validationResults = validateMap();
            const issues = validationResults.filter(result => result.type === 'error');
            const warnings = validationResults.filter(result => result.type === 'warning');
            const info = validationResults.filter(result => result.type === 'info');
            
            let message = '';
            
            if (issues.length > 0) {
                message += `❌ ERRORS (${issues.length}):\n`;
                issues.forEach(issue => message += `• ${issue.message}\n`);
                message += '\n';
            }
            
            if (warnings.length > 0) {
                message += `⚠️ WARNINGS (${warnings.length}):\n`;
                warnings.forEach(warning => message += `• ${warning.message}\n`);
                message += '\n';
            }
            
            if (info.length > 0) {
                message += `ℹ️ INFO (${info.length}):\n`;
                info.forEach(infoItem => message += `• ${infoItem.message}\n`);
                message += '\n';
            }
            
            if (issues.length === 0 && warnings.length === 0) {
                message = '✅ Map validation passed! No issues found.';
            }
            
            alert(message);
        };

        function validateMap() {
            const results = [];
            let crossServerTeleporters = 0;
            let sameServerTeleporters = 0;
            let spawnPoints = 0;
            const serverPorts = new Set();
            
            elements.forEach((element, index) => {
                // Check for elements with invalid dimensions
                if (element.width <= 0 || element.height <= 0) {
                    results.push({
                        type: 'error',
                        message: `Element ${index + 1} (${element.type}) has invalid dimensions: ${element.width}x${element.height}`
                    });
                }
                
                // Validate teleporters
                if (element.type === 'teleporter') {
                    if (!element.properties.teleportTo) {
                        results.push({
                            type: 'error',
                            message: `Teleporter ${index + 1} is missing teleportTo configuration`
                        });
                    } else {
                        const teleportTo = element.properties.teleportTo;
                        
                        if (typeof teleportTo.x !== 'number' || typeof teleportTo.y !== 'number') {
                            results.push({
                                type: 'error',
                                message: `Teleporter ${index + 1} has invalid coordinates: (${teleportTo.x}, ${teleportTo.y})`
                            });
                        }
                        
                        if (teleportTo.serverPort) {
                            crossServerTeleporters++;
                            serverPorts.add(teleportTo.serverPort);
                            
                            // Validate server port range
                            if (teleportTo.serverPort < 1 || teleportTo.serverPort > 65535) {
                                results.push({
                                    type: 'error',
                                    message: `Teleporter ${index + 1} has invalid server port: ${teleportTo.serverPort} (must be 1-65535)`
                                });
                            }
                            
                            // Warn about common development ports
                            if (![3000, 3001, 3002].includes(teleportTo.serverPort)) {
                                results.push({
                                    type: 'warning',
                                    message: `Teleporter ${index + 1} uses custom port ${teleportTo.serverPort}. Ensure this server is configured and running.`
                                });
                            }
                        } else {
                            sameServerTeleporters++;
                        }
                    }
                }
                
                // Count spawn points
                if (element.type === 'spawn') {
                    spawnPoints++;
                    if (!element.properties.spawnType) {
                        results.push({
                            type: 'warning',
                            message: `Spawn point ${index + 1} has no spawn type specified`
                        });
                    }
                }
            });
            
            // Summary information
            results.push({
                type: 'info',
                message: `Map contains ${elements.length} total elements`
            });
            
            if (crossServerTeleporters > 0) {
                results.push({
                    type: 'info',
                    message: `Found ${crossServerTeleporters} cross-server teleporter(s) targeting ${serverPorts.size} different server port(s): [${Array.from(serverPorts).join(', ')}]`
                });
            }
            
            if (sameServerTeleporters > 0) {
                results.push({
                    type: 'info',
                    message: `Found ${sameServerTeleporters} same-server teleporter(s)`
                });
            }
            
            results.push({
                type: 'info',
                message: `Found ${spawnPoints} spawn point(s)`
            });
            
            // Recommendations
            if (crossServerTeleporters > 0) {
                results.push({
                    type: 'info',
                    message: 'Remember to start all target servers before testing cross-server teleportation'
                });
            }
            
            if (spawnPoints === 0) {
                results.push({
                    type: 'warning',
                    message: 'No spawn points found. Players may not spawn correctly.'
                });
            }
            
            return results;
        };

        // Initial render
        render();
    </script>
</body>
</html>
