    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
            font-weight: 700;
            background-color: #000;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #loadingScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            text-align: center;
            font-size: 88px;
            transform: translate(-50%, -50%);
            color: #fff;
        }
        /* The two lines of the decompression screen, in the browser client's
           colours -- it showed this same message while it inflated its own
           bundle. Sized here rather than inheriting the 88px above, which is
           for the one word the screen otherwise holds. */
        #loadingScreen .stage {
            color: #ff0;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        #loadingScreen .detail {
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
        }

    </style>

<body>
    <span id="loadingScreen">Loading...</span>
    <canvas id="canvas" oncontextmenu="return false;"></canvas>
    <script>
        console.log('Hello');
    </script>
    <script>
(function () {
  const query = new URLSearchParams(location.search);
  const status = document.getElementById('loadingScreen');
  const canvas = document.getElementById('canvas');

  const host = query.get('host') || location.hostname || '127.0.0.1';
  // A page URL with no explicit port was served on its scheme's default,
  // and that is the port the game dials too. Whatever fronts the server --
  // nginx, Cloudflare's proxy -- answers there and forwards to the server's
  // own 3000, which is not reachable through it (Cloudflare will not carry
  // that port at all). The 3000 fallback is for a page with no origin port
  // to go by, such as one opened from disk.
  const defaultPort = location.protocol === 'https:' ? '443'
                    : location.protocol === 'http:' ? '80' : '3000';
  const port = query.get('port') || location.port || defaultPort;

  const args = ['--data', 'data', '--host', host, '--port', port];
  for (const name of ['user', 'password']) {
    const value = query.get(name);
    if (value !== null) args.push('--' + name, value);
  }
  if (query.get('lobby') !== null) args.push('--lobby');
  if (query.get('stats') !== null) args.push('--stats');
  // Forces the touch controls up on a desktop browser, which reports a mouse
  // and would otherwise never show them. For looking at them, not for playing.
  if (query.get('mobile') !== null) args.push('--mobile');
  for (const line of query.getAll('chat')) args.push('--chat', line);

  var Module = {
    canvas,
    arguments: args,
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => {
      if (!text) {
        status.hidden = true;
        canvas.focus();
        return;
      }
      status.hidden = false;
      status.textContent = text;
    },
    onAbort: (what) => {
      status.hidden = false;
      status.textContent = 'client error: ' + what;
    },
  };
  window.Module = Module;
})();
</script>
    <script>
(function () {
  const Module = window.Module;
  const status = document.getElementById('loadingScreen');

  // What the page downloads is bundle.js -- emscripten's runtime glue -- and
  // bundle.wasm, the client itself with mobs.json, petals.json, the maps and
  // the fonts embedded inside it: four megabytes of it. `npm run build`
  // stages a raw-deflate copy of each beside the original, bundle.js.bin and
  // bundle.wasm.bin, and this prefers them. Deflate takes the wasm to about a
  // third, and on a first visit that transfer is most of the wait.
  //
  // This is the browser client's compression scheme, carried over: the
  // TypeScript page deflated its bundle.js into bundle.bin at build time and
  // inflated it here with DecompressionStream, for the same reason and with
  // no library either side. What is new is that the wasm goes through it too,
  // since it is now where all the bytes are.
  //
  // The uncompressed files still ship, and nothing depends on the compressed
  // pair being there: a build served straight out of cpp/build-web has none
  // (compressing is a staging step -- an incremental relink should not spend
  // a second deflating four megabytes), and DecompressionStream is missing
  // from browsers older than 2023. Either way this falls through to the plain
  // file.
  const canInflate = typeof DecompressionStream === 'function';

  // Revalidate every load, but reuse the bytes when the build has not moved.
  // The failure worth designing against is a page still running the build
  // from before the last deploy: the server refuses that handshake and the
  // client reloads (client/web/reload.h), which is only an answer if the
  // reload fetches the new build. A 304 on an unchanged file costs nothing,
  // which is why this is no-cache where the TypeScript page said no-store --
  // re-downloading a megabyte of unchanged wasm on every load would give back
  // more than the compression saves.
  const fetchOptions = { cache: 'no-cache' };

  // Said while the inflating is going on, which on a first visit over a real
  // connection is the whole of the wait. The browser client put up this same
  // message for the same reason. It goes in the page's one status surface, so
  // nothing has to take it down: the glue's first setStatus ("Running...",
  // then "") replaces the markup with text and then hides the element.
  const announceInflating = () => {
    const stage = document.createElement('div');
    stage.className = 'stage';
    stage.textContent = 'Decompressing bundle...';
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.textContent = 'Please wait while we decompress the bundle...';
    status.hidden = false;
    status.textContent = '';
    status.append(stage, detail);
  };

  // The named artifact as a Response, inflated from its .bin when there is
  // one. Streamed rather than buffered, so what reads this Response sees the
  // bytes as they arrive -- the same thing the browser would hand
  // compileStreaming if it had fetched an uncompressed .wasm itself.
  const load = async (name, contentType) => {
    if (canInflate) {
      const packed = await fetch(name + '.bin', fetchOptions).catch(() => null);
      if (packed && packed.ok) {
        announceInflating();
        const inflating = new DecompressionStream('deflate-raw');
        return new Response(packed.body.pipeThrough(inflating),
                            { headers: { 'Content-Type': contentType } });
      }
    }
    const plain = await fetch(name, fetchOptions);
    if (!plain.ok) throw new Error(name + ': HTTP ' + plain.status);
    return plain;
  };

  const fail = (what) => {
    console.error('[loader] ' + what);
    status.hidden = false;
    status.textContent = 'client error: ' + what;
  };

  // Started now, before the glue: compiling the module is the long pole, and
  // this way it runs against the download instead of after it. compileStreaming
  // over a Response the page built itself is specified to work -- the MIME
  // type above is what it checks -- and the retry is for an engine that
  // disagrees. A module that simply does not compile fails the retry too,
  // with the same message.
  const compiled = load('bundle.wasm', 'application/wasm')
    .then((response) => WebAssembly.compileStreaming(response))
    .catch(async (error) => {
      console.warn('[loader] streaming compile failed (' + error + '); buffering');
      const response = await load('bundle.wasm', 'application/wasm');
      return WebAssembly.compile(await response.arrayBuffer());
    });

  // The glue asks for the module through this hook rather than going looking
  // for bundle.wasm, which is what keeps it off the uncompressed copy.
  // Returning an empty object is emscripten's "not yet": the instance arrives
  // through the callback whenever the compile above finishes.
  Module.instantiateWasm = (imports, ready) => {
    compiled.then((module) => WebAssembly.instantiate(module, imports))
            .then(ready)
            .catch((error) => fail('bundle.wasm: ' + error));
    return {};
  };

  // The glue itself, injected rather than left to the <script src> tag emcc
  // emits (parked in the comment at the end of this file), because the copy
  // worth loading is the compressed one. An injected script runs in global
  // scope exactly as that tag's would, and the glue picks up the Module
  // defined above the same way.
  load('bundle.js', 'text/javascript')
    .then((response) => response.text())
    .then((source) => {
      const script = document.createElement('script');
      script.textContent = source;
      document.body.appendChild(script);
    })
    .catch((error) => fail('bundle.js: ' + error));
})();
</script>
    <!-- emcc replaces the token below with a <script> tag for bundle.js, and
         refuses a shell that does not carry it. The loader above is what
         loads the glue here, from bundle.js.bin when there is one, so the tag
         is parked inside this comment: inert in the dev build, which keeps
         comments, and gone from the release build, which strips them.
         {{{ SCRIPT }}} -->
</body>
