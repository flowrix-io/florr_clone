<!DOCTYPE html>
<html lang="en">
<head>
    <!-- First, before anything else in the file: the wasm is embedded in the
         script below as UTF-8 text, and a browser that guessed another
         encoding for a file opened from disk would decode it into garbage. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>flowrix (offline)</title>
    <meta name="description" content="florr.io clone, single-player, in one file">
    <!-- Nothing external: no stylesheet, no favicon, no web fonts. This page
         is opened from a file:// URL with no server behind it, and every
         reference it made would be a request that fails. The faces the
         client draws with are registered from the bytes inside the wasm. -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Ubuntu', sans-serif;
            font-weight: 700;
            background-color: #000;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #loadingScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            text-align: center;
            font-size: 48px;
            transform: translate(-50%, -50%);
            color: #fff;
        }
    </style>
</head>
<body>
    <span id="loadingScreen">Loading...</span>
    <canvas id="canvas" oncontextmenu="return false;"></canvas>
    <script>
(function () {
  const query = new URLSearchParams(location.search);
  const status = document.getElementById('loadingScreen');
  const canvas = document.getElementById('canvas');

  // The server is in this page, so there is no host to name: offline/main.cpp
  // knows where it is. What the query may still say is the same set of
  // scripted-run switches the online shell forwards.
  const args = [];
  for (const name of ['user', 'password']) {
    const value = query.get(name);
    if (value !== null) args.push('--' + name, value);
  }
  if (query.get('lobby') !== null) args.push('--lobby');
  if (query.get('stats') !== null) args.push('--stats');
  for (const line of query.getAll('chat')) args.push('--chat', line);

  var Module = {
    canvas,
    arguments: args,
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    setStatus: (text) => {
      if (!text) {
        status.hidden = true;
        canvas.focus();
        return;
      }
      status.hidden = false;
      status.textContent = text;
    },
    onAbort: (what) => {
      canvas.style.display = 'none';
      status.hidden = false;
      status.innerHTML = '<b style="color: red;">game crashed: ' + what + '</b>';
    },
  };
  window.Module = Module;

  // --- the boot script ------------------------------------------------------
  // What the online page does (client/web/shell.html), under this page's own
  // storage prefix: Debug > Assets > Boot can name a script for the next load
  // to run instead of the game, and `?boot=game` / `?boot=reset` skip it once
  // or forget it. The difference is that the game is this page, inline below,
  // so it cannot be kept from loading -- only from starting. With a script to
  // run, main() waits (noInitialRun) and the script's startGame() calls it.
  const kBootPrefix = 'flowrix-offline/';
  const stored = (name) => {
    try {
      const saved = localStorage.getItem(kBootPrefix + name);
      if (!saved) return '';
      return new TextDecoder().decode(Uint8Array.from(atob(saved), (c) => c.charCodeAt(0)));
    } catch (e) {
      return '';
    }
  };
  const forget = () => {
    try {
      localStorage.removeItem(kBootPrefix + 'boot-script');
      localStorage.removeItem(kBootPrefix + 'boot-path');
    } catch (e) { }
  };
  const bootMode = query.get('boot');
  if (bootMode === 'reset') forget();
  const bootSource = bootMode === 'game' || bootMode === 'reset' ? '' : stored('boot-script');
  const bootPath = bootSource ? (stored('boot-path') || 'boot-script.js') : '';

  let runtimeReady = false;
  let startWanted = false;
  let gameStarted = false;
  const startGame = () => {
    if (gameStarted) return;
    // Asked for before the runtime is up: it starts the moment it is.
    if (!runtimeReady) {
      startWanted = true;
      return;
    }
    gameStarted = true;
    Module.callMain(Module.arguments);
  };
  Module.flixBoot = { path: bootPath, prefix: kBootPrefix, startGame, clear: forget };
  if (!bootSource) return;

  Module.noInitialRun = true;
  Module.onRuntimeInitialized = () => {
    runtimeReady = true;
    if (startWanted) startGame();
  };
  // A script that throws on its way in leaves a way out on screen.
  const bootFailed = (error) => {
    console.error('[boot] ' + bootPath + ' failed: ' + error);
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:16px;padding:24px;background:#16191c;' +
      'color:#fff;font:700 16px Ubuntu,sans-serif;text-align:center';
    const message = document.createElement('div');
    message.textContent = 'The boot script ' + bootPath + ' failed: ' + error;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
    const action = (label, run) => {
      const button = document.createElement('button');
      button.textContent = label;
      button.style.cssText = 'font:inherit;padding:8px 16px;border:0;border-radius:4px;' +
        'background:#4caf50;color:#fff;cursor:pointer';
      button.onclick = run;
      row.append(button);
    };
    action('Start the game', () => { box.remove(); startGame(); });
    action('Forget the script and reload', () => { forget(); location.reload(); });
    box.append(message, row);
    document.body.append(box);
  };

  console.info('[boot] running ' + bootPath + ' instead of the game; ' +
               '?boot=game skips it once, ?boot=reset forgets it');
  try {
    // An indirect eval, for global scope: see the online page.
    window.eval(bootSource + '\n//# sourceURL=' + bootPath.replace(/^\/+/, ''));
  } catch (error) {
    bootFailed(error);
  }
})();
</script>
    {{{ SCRIPT }}}
</body>
</html>
